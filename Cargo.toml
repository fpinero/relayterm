[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
uuid = { version = "1", default-features = false, features = ["std", "serde", "v4"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
time = { version = "0.3", default-features = false, features = ["std"] }
directories = "6.0.0"
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
blake3 = { version = "1.8.2", default-features = false, features = ["pure", "std"] }
toml = { version = "1.1.5", default-features = false, features = ["parse", "serde", "std"] }
sqlx = { version = "0.9.0", default-features = false, features = ["migrate", "runtime-tokio", "sqlite-bundled"] }
tokio = { version = "1.47.1", default-features = false, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tempfile = "3.21.0"
rustix = { version = "1.0.8", default-features = false, features = ["fs", "process"] }
windows-permissions = "0.2.4"
interprocess = { version = "2.4.0", default-features = false, features = ["tokio"] }
base64 = "0.22.1"
widestring = "1.2.1"
portable-pty = { package = "portable-pty-psmux", version = "0.9.7" }
vt100 = "0.16.2"
crossterm = "0.29.0"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
