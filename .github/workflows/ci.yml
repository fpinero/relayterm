name: Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned compiler
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Fetch complete locked graph
        run: cargo fetch --locked
      - name: Test release tooling
        run: python -m unittest scripts/test_build_release.py scripts/test_package_release.py scripts/test_install_release.py
      - name: Build release twice
        run: |
          python scripts/build_release.py build --target ${{ matrix.target }} --output release-build-a --offline
          python scripts/build_release.py build --target ${{ matrix.target }} --output release-build-b --offline
      - name: Compare release executables
        run: python scripts/build_release.py compare release-build-a/build-record.json release-build-b/build-record.json
      - name: Package release twice
        run: |
          python scripts/package_release.py create --build release-build-a --output release-package-a
          python scripts/package_release.py create --build release-build-b --output release-package-b
      - name: Compare release archives
        run: python scripts/package_release.py compare release-package-a/relayterm-0.1.0-${{ matrix.target }}.manifest.json release-package-b/relayterm-0.1.0-${{ matrix.target }}.manifest.json
      - name: Inspect exact archive inventory
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            python scripts/package_release.py inspect release-package-a/relayterm-0.1.0-${{ matrix.target }}.zip
          else
            python scripts/package_release.py inspect release-package-a/relayterm-0.1.0-${{ matrix.target }}.tar.gz
          fi
      - name: Smoke-test extracted release
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            python scripts/smoke_release.py release-package-a/relayterm-0.1.0-${{ matrix.target }}.zip
          else
            python scripts/smoke_release.py release-package-a/relayterm-0.1.0-${{ matrix.target }}.tar.gz
          fi
      - name: Extract reviewed release for TUI gate
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            archive=release-package-a/relayterm-0.1.0-${{ matrix.target }}.zip
            executable=rt.exe
          else
            archive=release-package-a/relayterm-0.1.0-${{ matrix.target }}.tar.gz
            executable=rt
          fi
          python scripts/package_release.py extract "$archive" --output release-extracted
          echo "RELAYTERM_TEST_RT=${{ github.workspace }}/release-extracted/relayterm-0.1.0-${{ matrix.target }}/$executable" >> "$GITHUB_ENV"
      - name: Test TUI through extracted release
        timeout-minutes: 10
        run: cargo test -p relayterm-cli --test tui_gate --locked -- --nocapture --test-threads=1
      - name: Test session presentation through extracted release
        timeout-minutes: 5
        run: cargo test -p relayterm-cli --test session_presentation --locked -- --nocapture --test-threads=1
      - name: Test worktree journey through extracted release
        timeout-minutes: 10
        run: cargo test -p relayterm-cli --test worktree_gate --locked -- --nocapture --test-threads=1
      - name: Test backup and restore through extracted release
        timeout-minutes: 10
        run: cargo test -p relayterm-cli --test backup_restore --locked -- --nocapture --test-threads=1

  native:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            toolchain: stable
          - os: macos-14
            toolchain: stable
          - os: windows-2022
            toolchain: stable
          - os: ubuntu-24.04
            toolchain: 1.98.1
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install compiler
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
      - name: Report compiler
        run: rustc --version --verbose
      - name: Report Cargo
        run: cargo --version
      - name: Fetch complete locked graph
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check targets
        run: cargo check --workspace --all-targets --locked
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test detached daemon lifecycle
        timeout-minutes: 3
        run: cargo test -p relayterm-cli --test cli detached_daemon_survives_starters_and_reopens_durable_state --locked -- --exact --nocapture --test-threads=1
      - name: Test first durable slice, pass 1
        timeout-minutes: 10
        run: cargo test -p relayterm-cli --test durable_slice --locked -- --nocapture --test-threads=1
      - name: Test first durable slice, pass 2
        timeout-minutes: 10
        run: cargo test -p relayterm-cli --test durable_slice --locked -- --nocapture --test-threads=1
      - name: Test real PTY supervision, pass 1
        timeout-minutes: 10
        run: cargo test -p relayterm-daemon --test pty_gate --locked -- --nocapture --test-threads=1
      - name: Test real PTY supervision, pass 2
        timeout-minutes: 10
        run: cargo test -p relayterm-daemon --test pty_gate --locked -- --nocapture --test-threads=1
      - name: Test TUI workflow, pass 1
        timeout-minutes: 10
        run: cargo test -p relayterm-cli --test tui_gate --locked -- --nocapture --test-threads=1
      - name: Test TUI workflow, pass 2
        timeout-minutes: 10
        run: cargo test -p relayterm-cli --test tui_gate --locked -- --nocapture --test-threads=1
      - name: Test agent templates, pass 1
        timeout-minutes: 10
        run: cargo test -p relayterm-cli --test agent_templates_gate --locked -- --nocapture --test-threads=1
      - name: Test agent templates, pass 2
        timeout-minutes: 10
        run: cargo test -p relayterm-cli --test agent_templates_gate --locked -- --nocapture --test-threads=1
      - name: Test Git worktree isolation, pass 1
        if: matrix.toolchain == 'stable'
        timeout-minutes: 10
        run: cargo test -p relayterm-cli --test worktree_gate --locked -- --nocapture --test-threads=1
      - name: Test Git worktree isolation, pass 2
        if: matrix.toolchain == 'stable'
        timeout-minutes: 10
        run: cargo test -p relayterm-cli --test worktree_gate --locked -- --nocapture --test-threads=1
      - name: Test M11 hardening, pass 1
        if: matrix.toolchain == 'stable'
        timeout-minutes: 10
        run: cargo test -p relayterm-cli --test hardening_gate --locked -- --nocapture --test-threads=1
      - name: Test M11 hardening, pass 2
        if: matrix.toolchain == 'stable'
        timeout-minutes: 10
        run: cargo test -p relayterm-cli --test hardening_gate --locked -- --nocapture --test-threads=1
      - name: Test M11 protocol faults, pass 1
        if: matrix.toolchain == 'stable'
        timeout-minutes: 5
        run: cargo test -p relayterm-daemon --test protocol_gate --locked -- --nocapture --test-threads=1
      - name: Test M11 protocol faults, pass 2
        if: matrix.toolchain == 'stable'
        timeout-minutes: 5
        run: cargo test -p relayterm-daemon --test protocol_gate --locked -- --nocapture --test-threads=1
      - name: Test M11 abrupt SQLite rollback, pass 1
        if: matrix.toolchain == 'stable'
        timeout-minutes: 5
        run: cargo test -p relayterm-daemon --test sqlite_kill_gate --features test-hooks --locked -- --nocapture --test-threads=1
      - name: Test M11 abrupt SQLite rollback, pass 2
        if: matrix.toolchain == 'stable'
        timeout-minutes: 5
        run: cargo test -p relayterm-daemon --test sqlite_kill_gate --features test-hooks --locked -- --nocapture --test-threads=1
      - name: Test M11 Git cancellation, pass 1
        if: matrix.toolchain == 'stable'
        timeout-minutes: 5
        run: cargo test -p relayterm-daemon --test worktree_cancellation_gate --features test-hooks --locked -- --nocapture --test-threads=1
      - name: Test M11 Git cancellation, pass 2
        if: matrix.toolchain == 'stable'
        timeout-minutes: 5
        run: cargo test -p relayterm-daemon --test worktree_cancellation_gate --features test-hooks --locked -- --nocapture --test-threads=1
      - name: Test M11 Git descendant containment, pass 1
        if: matrix.toolchain == 'stable'
        timeout-minutes: 2
        run: cargo test -p relayterm-git --lib --locked tests::completed_git -- --ignored --nocapture --test-threads=1
      - name: Test M11 Git descendant containment, pass 2
        if: matrix.toolchain == 'stable'
        timeout-minutes: 2
        run: cargo test -p relayterm-git --lib --locked tests::completed_git -- --ignored --nocapture --test-threads=1
      - name: Test M11 durable scale, pass 1
        if: matrix.toolchain == 'stable'
        timeout-minutes: 5
        run: cargo test -p relayterm-persistence-sqlite --test resource_gate --locked -- --nocapture --test-threads=1
      - name: Test M11 durable scale, pass 2
        if: matrix.toolchain == 'stable'
        timeout-minutes: 5
        run: cargo test -p relayterm-persistence-sqlite --test resource_gate --locked -- --nocapture --test-threads=1
      - name: Test M11 offline runtime, pass 1
        if: matrix.toolchain == 'stable'
        timeout-minutes: 5
        run: cargo test -p relayterm-cli --test offline_gate --locked -- --nocapture --test-threads=1
      - name: Test M11 offline runtime, pass 2
        if: matrix.toolchain == 'stable'
        timeout-minutes: 5
        run: cargo test -p relayterm-cli --test offline_gate --locked -- --nocapture --test-threads=1
      - name: Test M11 sustained resources, pass 1
        if: matrix.toolchain == 'stable'
        timeout-minutes: 5
        run: cargo test -p relayterm-cli --test resource_runtime_gate --locked sustained_output_memory_and_reconnect_resources_are_bounded -- --ignored --exact --nocapture --test-threads=1
      - name: Test M11 sustained resources, pass 2
        if: matrix.toolchain == 'stable'
        timeout-minutes: 5
        run: cargo test -p relayterm-cli --test resource_runtime_gate --locked sustained_output_memory_and_reconnect_resources_are_bounded -- --ignored --exact --nocapture --test-threads=1
      - name: Test private backup and restore
        if: matrix.toolchain == 'stable'
        timeout-minutes: 5
        run: cargo test -p relayterm-cli --test backup_restore --locked -- --nocapture --test-threads=1
      - name: Test workspace and CLI contracts
        timeout-minutes: 10
        run: cargo test --workspace --locked
      - name: Test core without UI
        run: cargo test -p relayterm-domain -p relayterm-application -p relayterm-protocol --locked
      - name: Build
        run: cargo build --workspace --locked
      - name: Check repository contracts
        run: python scripts/check_repository.py
      - name: Check whitespace
        run: git diff --check
